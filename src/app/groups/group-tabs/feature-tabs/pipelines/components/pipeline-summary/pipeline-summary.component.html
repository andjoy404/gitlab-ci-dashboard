<section class="pipeline-summary" aria-label="Root group pipeline overview">
  <div class="total">
    <span class="label">Latest pipelines</span>
    <strong>{{ total() }}</strong>
    <span class="hint">one newest pipeline per branch</span>
  </div>

  <div class="distribution">
    @if (segments().length) {
      <div class="bar" role="img" aria-label="Pipeline status distribution">
        @for (segment of segments(); track segment.status) {
          <div
            class="segment"
            [style.background]="segment.status | statusColor"
            [style.width.%]="segment.percentage"
            [title]="segment.status + ': ' + segment.count"
          ></div>
        }
      </div>
      <div class="legend">
        @for (segment of segments(); track segment.status) {
          <span class="legend-item">
            <i [style.background]="segment.status | statusColor"></i>
            {{ segment.status }} <strong>{{ segment.count }}</strong>
          </span>
        }
      </div>
    } @else {
      <span class="empty">No pipelines loaded</span>
    }
  </div>
</section>
